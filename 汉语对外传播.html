        <div id="main" style="width: 800px; height: 1000px; "class="animated fadeInUp"></div>
            <script type="text/javascript">
                // 初始化echarts实例
                var chartDom = document.getElementById('main');
                var myChart = echarts.init(document.getElementById("main"));
                const mapOption= {
                    title: {  //标题样式
                        text: '全球孔子学院大洲分布图',
                        x: "center",
                        textStyle: {
                            fontSize: 18,
                            color: "#16982b"
                        },
                    },
                    tooltip: {  //这里设置提示框
                trigger: 'item',  //数据项图形触发
                backgroundColor: "#CDC1C5",  //提示框浮层的背景颜色。
                //字符串模板(地图): {a}（系列名称），{b}（区域名称），{c}（合并数值）,{d}（无）
                formatter: function(params){
                    //定义一个res变量来保存最终返回的字符结果,并且先把地区名称放到里面
                    var res=params.name+'<br />';
                    //定义一个变量来保存series数据系列
                    var myseries=mapOption.series;
                    //循环遍历series数据系列
                    for(var i=0;i<myseries.length;i++){
                        //在内部继续循环series[i],从data中判断：当地区名称等于params.name的时候就将当前数据和名称添加到res中供显示
                        for(var k=0;k<myseries[i].data.length;k++){
                            //console.log(myseries[i].data[k].name);
                            //如果data数据中的name和地区名称一样
                            if(myseries[i].data[k].name==params.name){
                                //将series数据系列每一项中的name和数据系列中当前地区的数据添加到res中
                                res+=myseries[i].name+':'+myseries[i].data[k].value+'<br />';
                            }
                        }
                    }
                    //返回res
                    //console.log(res);
                    return res;                
                },
                
                    
            },
                    visualMap: {//视觉映射组件
                        top: 'center',
                        left: 'left',
                        min: 0,
                        max: 800,
                        text: ['High', 'Low'],
                        realtime: true,  //拖拽时，是否实时更新
                        calculable: true,  //是否显示拖拽用的手柄
                        inRange: {
                            color: ['#313695', '#4575b4', '#74add1', '#abd9e9', '#e0f3f8', '#ffffbf', '#fee090', '#fdae61', '#f46d43', '#d73027', '#a50026']
                        }
                    },
                    series: [
                        {
                            
                            name: '孔子学院数量',
                            type: 'map',
                            
                            universalTransition: false,
                            mapType: 'world',
                            roam: true,//是否开启鼠标缩放和平移漫游
                            itemStyle: {//地图区域的多边形 图形样式
                                normal: {//是图形在默认状态下的样式
                                    label: {
                                        show: false,//是否显示标签
                                        textStyle: {
                                            color: "black"
                                        }
                                    }
                                },
                                zoom: 1.5,  //地图缩放比例,默认为1
                                emphasis: {//是图形在高亮状态下的样式,比如在鼠标悬浮或者图例联动高亮时
                                    label: { show: true,
                                        textStyle: {
                                            color: "#4F4F4F",
                                            fontSize:20,  
                                        },
                                        }
                                }
                            },
                            top: "10%",//组件距离容器的距离
                            data:[
                                { name: '北美洲', value:113},
                                { name: '拉丁美洲', value: 31 },
                                { name: '非洲', value: 62 },
                                { name: '欧洲', value: 187 },
                                { name: '亚洲', value: 137 },
                                { name: '大洋洲', value: 20 },
                            ]
                        },
                        {
                            name: '孔子课堂数量',
                            type: 'map',
                        
                            universalTransition: false,
                            mapType: 'world',
                            roam: false,//是否开启鼠标缩放和平移漫游
                            itemStyle: {//地图区域的多边形 图形样式
                                normal: {//是图形在默认状态下的样式
                                    label: {
                                        show: false,//是否显示标签
                                        textStyle: {
                                            color: "black"
                                        }
                                    }
                                },
                                zoom: 1.5,  //地图缩放比例,默认为1
                                emphasis: {//是图形在高亮状态下的样式,比如在鼠标悬浮或者图例联动高亮时
                                    label: { show: true }
                                }
                            },
                            top: "3%",//组件距离容器的距离
                            data:[
                                { name: '北美洲', value:541},
                                { name: '拉丁美洲', value: 19 },
                                { name: '非洲', value: 48 },
                                { name: '欧洲', value: 348 },
                                { name: '亚洲', value: 115 },
                                { name: '大洋洲', value: 101 },
                            ]}
                      ]
                    };
            myChart.setOption(mapOption);
          mapOption && myChart.setOption(mapOption);
            </script>

            <div id="main1" style="width: 600px;height: 300px;"class="animated fadeInUp">

                    myChart.setOption(option);

            myChart.setOption(option);
